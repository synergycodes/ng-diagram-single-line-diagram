<!-- Full-bleed canvas; all chrome floats over it. -->
<app-diagram class="sld-canvas" />

<header class="navbar">
  <div class="navbar__left">
    <span class="navbar__logo" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path
          d="M2 12 L6 12 L6 4 L10 4 L10 12 L14 12"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
    <span class="navbar__brand">SLD Builder</span>
    <span class="navbar__divider" aria-hidden="true"></span>
    @if (editingName()) {
      <input
        #nameInput
        type="text"
        class="navbar__doc-input"
        [value]="schematicName.name()"
        maxlength="80"
        aria-label="Schematic name"
        (keydown.enter)="nameInput.blur()"
        (keydown.escape)="cancelNameEdit(nameInput)"
        (blur)="commitName(nameInput.value)"
      />
    } @else {
      <span
        class="navbar__doc"
        role="button"
        tabindex="0"
        title="Double-click to rename"
        (dblclick)="startNameEdit()"
        (keydown.enter)="startNameEdit()"
        >{{ schematicName.name() }}</span
      >
    }
  </div>

  <div class="navbar__right">
    <app-mode-toggle />
    <app-theme-toggle />
    <span class="navbar__divider" aria-hidden="true"></span>
    <button
      type="button"
      class="navbar__export"
      [disabled]="!exportReady()"
      title="Export the diagram as an editable SVG"
      (click)="exportSvg()"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M12 3 L12 14 M8 7 L12 3 L16 7"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M5 13 L5 20 L19 20 L19 13"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      Export
    </button>
  </div>
</header>

@if (paletteOpen()) {
  <app-symbol-library class="sld-palette" (collapse)="togglePalette()" />
} @else {
  <button
    type="button"
    class="palette-fab"
    title="Show symbol library"
    aria-label="Show symbol library"
    (click)="togglePalette()"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="4" y="4" width="6.5" height="6.5" rx="1.5" stroke="currentColor" stroke-width="2" />
      <rect
        x="13.5"
        y="4"
        width="6.5"
        height="6.5"
        rx="1.5"
        stroke="currentColor"
        stroke-width="2"
      />
      <rect
        x="4"
        y="13.5"
        width="6.5"
        height="6.5"
        rx="1.5"
        stroke="currentColor"
        stroke-width="2"
      />
      <rect
        x="13.5"
        y="13.5"
        width="6.5"
        height="6.5"
        rx="1.5"
        stroke="currentColor"
        stroke-width="2"
      />
    </svg>
  </button>
}

<app-properties-panel class="sld-props" />
