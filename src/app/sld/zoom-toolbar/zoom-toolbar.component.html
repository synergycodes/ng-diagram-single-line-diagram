<button
  type="button"
  class="zoom__btn"
  title="Zoom out"
  [disabled]="!viewport.canZoomOut()"
  (click)="zoomOut()"
>
  <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
    <path d="M3 8 L13 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
  </svg>
</button>

<button type="button" class="zoom__pct" title="Reset to 100%" (click)="resetZoom()">
  {{ zoomPercent() }}%
</button>

<button
  type="button"
  class="zoom__btn"
  title="Zoom in"
  [disabled]="!viewport.canZoomIn()"
  (click)="zoomIn()"
>
  <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
    <path
      d="M3 8 L13 8 M8 3 L8 13"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
    />
  </svg>
</button>

<span class="zoom__sep" aria-hidden="true"></span>

<button type="button" class="zoom__btn" title="Fit to screen" (click)="fit()">
  <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
    <path
      d="M3 6 L3 3 L6 3 M10 3 L13 3 L13 6 M13 10 L13 13 L10 13 M6 13 L3 13 L3 10"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </svg>
</button>

<button
  type="button"
  class="zoom__btn"
  [class.is-active]="minimapOpen()"
  [attr.aria-pressed]="minimapOpen()"
  [title]="minimapOpen() ? 'Hide minimap' : 'Show minimap'"
  (click)="toggleMinimap()"
>
  <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
    <rect
      x="2.5"
      y="3"
      width="11"
      height="10"
      rx="1"
      stroke="currentColor"
      stroke-width="1.4"
      fill="none"
    />
    <path
      d="M5 6 L8 4 L11 6 L11 11 L8 9 L5 11 Z M8 4 L8 9"
      stroke="currentColor"
      stroke-width="1.2"
      fill="none"
      stroke-linejoin="round"
    />
  </svg>
</button>

<button
  type="button"
  class="zoom__btn"
  [class.is-active]="cheatSheetOpen()"
  [attr.aria-pressed]="cheatSheetOpen()"
  [title]="cheatSheetOpen() ? 'Hide shortcuts' : 'Keyboard shortcuts'"
  (click)="toggleCheatSheet()"
>
  <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
    <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4" fill="none" />
    <path
      d="M6 6.2 C6 4.8 7 4 8 4 C9 4 10 4.8 10 6 C10 7 8.8 7.5 8 8.2 L8 9.2"
      stroke="currentColor"
      stroke-width="1.4"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="8" cy="11.5" r="0.7" fill="currentColor" />
  </svg>
</button>

@if (minimapOpen()) {
  <div class="zoom__minimap-popover" role="region" aria-label="Minimap">
    <ng-diagram-minimap
      class="zoom__minimap"
      [width]="220"
      [height]="150"
      [showZoomControls]="false"
      [deferNodeUpdates]="true"
      [nodeStyle]="minimapNodeStyle()"
    />
  </div>
}

@if (cheatSheetOpen()) {
  <div class="zoom__cheatsheet-popover" role="region" aria-label="Keyboard shortcuts">
    <app-cheat-sheet />
  </div>
}
