<label class="sld-field">
  <span class="sld-field__label">
    <span class="sld-field__label-text">{{ props.label }}</span>
    @if (props['unit']) {
      <span class="sld-field__unit">{{ props['unit'] }}</span>
    }
  </span>
  <input
    class="sld-field__input"
    type="text"
    [attr.inputmode]="props['inputMode'] || null"
    (beforeinput)="onBeforeInput($event)"
    [formControl]="formControl"
    [formlyAttributes]="field"
  />
</label>
