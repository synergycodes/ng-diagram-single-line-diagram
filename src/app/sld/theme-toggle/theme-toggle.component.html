<div class="theme-toggle" role="radiogroup" aria-label="Color theme">
  <button
    type="button"
    role="radio"
    class="theme-toggle__btn"
    [class.is-active]="theme() === 'light'"
    [attr.aria-checked]="theme() === 'light'"
    title="Light theme"
    (click)="select('light')"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" />
      <path
        d="M12 2.5V4.5 M12 19.5V21.5 M2.5 12H4.5 M19.5 12H21.5 M5.1 5.1L6.5 6.5 M17.5 17.5L18.9 18.9 M18.9 5.1L17.5 6.5 M6.5 17.5L5.1 18.9"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  </button>
  <button
    type="button"
    role="radio"
    class="theme-toggle__btn"
    [class.is-active]="theme() === 'dark'"
    [attr.aria-checked]="theme() === 'dark'"
    title="Dark theme"
    (click)="select('dark')"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</div>
